# ==========================================================================
#  pirouter configuration
#  This file is sourced by bash. Keep KEY="value" format, no spaces around =
# ==========================================================================

# --- Router mode ---
# gateway = Pi is your MAIN router (uplink comes straight from modem/ISP)
# client  = Pi sits BEHIND your existing main router (uplink = that router's LAN)
#           This is the usual case: main router -> cable -> Pi eth0.
ROUTER_MODE="client"

# --- Interfaces ---
WAN_IF="eth0"          # uplink to internet (cable)
LAN_IF="wlan0"         # access point interface (built-in wifi)

# --- LAN / DHCP ---
LAN_IP="192.168.33.1"
LAN_CIDR="24"
DHCP_START="192.168.33.50"
DHCP_END="192.168.33.200"
DHCP_LEASE="12h"
LAN_DNS="1.1.1.1,8.8.8.8"

# --- Wi-Fi access point ---
WIFI_SSID="PiRouter"
WIFI_PASS="changeme123"
WIFI_CHANNEL="7"
WIFI_COUNTRY="US"
WIFI_HIDDEN="0"        # 1 = hide SSID
# Wi-Fi security mode:
#   wpa2   = WPA2-PSK (CCMP)          - most compatible, recommended for Pi 3B
#   wpa2wpa3 = WPA2/WPA3 mixed (SAE+PSK) - new devices use WPA3, old ones WPA2
#   wpa3   = WPA3-SAE only            - Pi 3B onboard chip can be unstable in AP mode
#   open   = no password (testing only)
WIFI_SECURITY="wpa2"

# --- MAC addresses ---
# "auto" = use hardware default. Otherwise a MAC like DE:AD:BE:EF:00:01
WIFI_MAC="auto"
WAN_MAC="auto"

# --- Kill switch ---
# on  = block ALL forwarded traffic unless it goes through an active VPN tunnel
# off = normal NAT routing through WAN
KILLSWITCH="on"

# --- Security / leak protection ---
# Force every client DNS query through the router (stops DNS-server bypass)
FORCE_DNS="on"
# Drop QUIC (UDP/443). Needed so browsers fall back to TCP, which is what the
# VLESS/proxy transparent redirect can actually tunnel. Also prevents UDP leaks.
BLOCK_QUIC="on"
# Disable IPv6 entirely (prevents IPv6 traffic leaking around the IPv4 VPN)
DISABLE_IPV6="on"
# Allow SSH management from the WAN side.
#   on  = you can SSH to the Pi via its eth0 address (needed in CLIENT mode,
#         where you manage the Pi from your main home LAN). Default.
#   off = SSH only from the Pi's own Wi-Fi/LAN. Safer in GATEWAY mode where
#         eth0 faces the open internet - but do NOT set this in client mode
#         unless you also connect a keyboard/monitor, or you may lock yourself out.
MGMT_WAN_SSH="on"

# --- Active VPN ---
# none | openvpn | l2tp | vless | proxy
ACTIVE_VPN="none"

# --- L2TP settings ---
L2TP_SERVER=""
L2TP_PSK=""
L2TP_USER=""
L2TP_PASS=""

# --- Proxy / VLESS ---
# VLESS_URL holds the CURRENTLY ACTIVE vless:// link. Up to 5 named profiles
# are stored in /etc/pirouter/vless.list and managed from the control panel;
# selecting one copies its link here. VLESS_ACTIVE is the selected profile name.
VLESS_URL=""
VLESS_ACTIVE=""
# For generic "proxy" (socks5 or http upstream):
PROXY_TYPE="socks5"    # socks5 | http
PROXY_HOST=""
PROXY_PORT=""
PROXY_USER=""
PROXY_PASS=""

# --- Transparent proxy local ports (Xray) ---
XRAY_REDIR_PORT="12345"
XRAY_DNS_PORT="15353"
XRAY_SOCKS_PORT="10808"   # local-only SOCKS inbound used for tunnel self-tests
